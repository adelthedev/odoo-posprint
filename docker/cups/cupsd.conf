# cupsd config for the pos_server_print sidecar.
# Accepts job submissions from anywhere on the compose network; the container's
# 631 is only published to localhost on the host (ops/debug web UI).

Listen 0.0.0.0:631

# cupsd validates the HTTP Host: header; without this it rejects requests
# addressed to the compose-network alias ("cups:631") with a 400.
ServerAlias *

Browsing Off
WebInterface Yes

# Don't require auth for job submission from the compose network.
DefaultAuthType Basic

# If a printer is unreachable, retry the job instead of stopping the queue.
ErrorPolicy retry-job
# Retry every 15s, up to 240 times (~1 hour) before failing the job.
JobRetryInterval 15
JobRetryLimit 240

# Keep job history + files so reprints/debugging via web UI work.
PreserveJobHistory Yes
PreserveJobFiles 1d

<Location />
  Order allow,deny
  Allow all
</Location>

<Location /admin>
  Order allow,deny
  Allow all
</Location>

<Policy default>
  <Limit Send-Document Send-URI Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Create-Job-Subscription Renew-Subscription Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job Cancel-My-Jobs Close-Job CUPS-Move-Job CUPS-Get-Document>
    Order deny,allow
    Allow all
  </Limit>
  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>
  <Limit Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer Promote-Job Schedule-Job-After Cancel-Jobs CUPS-Accept-Jobs CUPS-Reject-Jobs>
    Order deny,allow
    Allow all
  </Limit>
  <Limit Cancel-Job CUPS-Authenticate-Job>
    Order deny,allow
    Allow all
  </Limit>
  <Limit All>
    Order deny,allow
    Allow all
  </Limit>
</Policy>
